name: Claude Code PR Review

on:
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened ]

jobs:
  claude-review:
    name: Claude Code Automated Review

    # Must run on the Windows PC where OmniRoute is running
    runs-on: [self-hosted, Windows, X64]

    permissions:
      contents: read
      pull-requests: write
      id-token: write

    env:
      # Directory where bun will be installed (workspace is the runner's work dir)
      BUN_DIR: ${{ github.workspace }}\bun

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify runner
        shell: powershell
        run: |
          Write-Host "===== RUNNER ====="
          Write-Host "Computer: $env:COMPUTERNAME"
          Write-Host "User: $env:USERNAME"
          Write-Host "Workspace: $env:GITHUB_WORKSPACE"
          Write-Host "=================="

      - name: Verify OmniRoute
        shell: powershell
        env:
          OMNIROUTE_API_KEY: ${{ secrets.OMNIROUTE_API_KEY }}
        run: |
          Write-Host "Testing OmniRoute..."

          $headers = @{
            "Authorization" = "Bearer $env:OMNIROUTE_API_KEY"
          }

          try {
            $response = Invoke-RestMethod `
              -Uri "http://localhost:20128/v1/models" `
              -Headers $headers `
              -Method Get `
              -TimeoutSec 30

            Write-Host "OmniRoute is reachable."
            Write-Host ($response | ConvertTo-Json -Depth 5)
          }
          catch {
            Write-Error "Cannot connect to OmniRoute at localhost:20128"
            Write-Error $_
            exit 1
          }

          # Add Git Bash to PATH for the action's sub-shells (which use 'shell: bash')
          if (Test-Path "C:\Program Files\Git\usr\bin\bash.exe") {
            Add-Content $env:GITHUB_PATH "C:\Program Files\Git\usr\bin"
            Write-Host "Added Git Bash to PATH"
          }

      - name: Install Bun
        shell: powershell
        run: |
          # Skip if already installed
          $bunExe = "$env:BUN_DIR\bun-windows-x64\bun.exe"
          if (Test-Path $bunExe) {
            Write-Host "Bun already installed at $bunExe"
          } else {
            Write-Host "Installing Bun to $env:BUN_DIR"
            New-Item -Path "$env:BUN_DIR" -ItemType Directory -Force | Out-Null
            Invoke-WebRequest `
              -Uri "https://github.com/oven-sh/bun/releases/download/bun-v1.3.14/bun-windows-x64.zip" `
              -OutFile "$env:TEMP\bun.zip" `
              -TimeoutSec 120
            Expand-Archive -Path "$env:TEMP\bun.zip" -DestinationPath "$env:BUN_DIR" -Force
            Remove-Item "$env:TEMP\bun.zip" -ErrorAction SilentlyContinue
            Write-Host "Bun installed at $bunExe"
          }
          # Copy bun.exe up one level so it can be found at BUN_DIR\bun.exe
          # (the zip extracts to BUN_DIR\bun-windows-x64\bun.exe)
          Copy-Item -Path "$env:BUN_DIR\bun-windows-x64\bun.exe" -Destination "$env:BUN_DIR\bun.exe" -Force
          Write-Host "Copied bun.exe to $env:BUN_DIR\bun.exe"

      - name: Install dependencies
        shell: powershell
        run: |
          python -m pip install pytest

      - name: Run tests
        shell: powershell
        run: |
          python -m pytest tests/ -v --tb=short

      - name: Claude Code Review
        uses: anthropics/claude-code-action@v1
        env:
          # Claude Code sends requests to OmniRoute.
          # Do NOT add /v1 here.
          ANTHROPIC_BASE_URL: http://localhost:20128
        with:
          # Skip the action's internal bun installer (which requires admin/symlinks).
          # We pre-install bun above and pass the path here.
          path_to_bun_executable: ${{ github.workspace }}\bun\bun.exe
          # Use the OmniRoute key, NOT an Anthropic API key.
          anthropic_api_key: ${{ secrets.OMNIROUTE_API_KEY }}
          prompt: |
            Read CLAUDE.md in this repository to understand the project standards.

            Review every Python file changed in this pull request.

            Check for:

            BLOCKING ISSUES:
            - Any function missing type hints
            - Any function missing a docstring
            - Any new function with no corresponding test
            - Any function longer than 20 lines

            WARNINGS:
            - Magic numbers used without named constants
            - Functions with more than 3 parameters
            - Missing edge case tests

            Format your response as:

            ## Claude Code Review

            ### BLOCKING ISSUES

            List each issue with:
            - File
            - Function name
            - Exact problem

            ### WARNINGS

            List each warning with:
            - File
            - Function name
            - Explanation

            ### SUMMARY

            One sentence:
            APPROVED
            or
            CHANGES REQUIRED

            If there are any BLOCKING ISSUES, end with exactly:

            REVIEW_STATUS: BLOCKED

            If there are no blocking issues, end with exactly:

            REVIEW_STATUS: APPROVED
