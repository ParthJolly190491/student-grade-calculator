name: Claude Code PR Review

on:
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened ]

jobs:
  claude-review:
    name: Claude Code Automated Review

    # Run on self-hosted Windows PC where OmniRoute is running
    runs-on: [self-hosted, Windows, X64]

    permissions:
      contents: read
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pytest

      - name: Run tests
        run: |
          pytest tests/ -v --tb=short

      - name: Claude Code Review
        uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_BASE_URL: http://localhost:20128
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.OMNIROUTE_API_KEY }}
        with:
          prompt: |
            Read CLAUDE.md in this repository to understand the project standards.

            Review every Python file changed in this pull request.

            Check for:

            BLOCKING ISSUES:
            - Any function missing type hints
            - Any function missing a docstring
            - Any new function with no corresponding test
            - Any function longer than 20 lines

            WARNINGS:
            - Magic numbers used without named constants
            - Functions with more than 3 parameters
            - Missing edge case tests

            Format your response as:

            ## Claude Code Review

            ### BLOCKING ISSUES

            (list each issue with file, function name, and exact problem)

            ### WARNINGS

            (list each warning with file and explanation)

            ### SUMMARY

            (one sentence: APPROVED or CHANGES REQUIRED)

            If there are any BLOCKING ISSUES, end with exactly:

            REVIEW_STATUS: BLOCKED

            If there are no blocking issues, end with:

            REVIEW_STATUS: APPROVED
