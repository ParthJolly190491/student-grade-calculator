name: Claude Code PR Review

on:
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened ]

jobs:
  claude-review:
    name: Claude Code Automated Review

    # Run on self-hosted Windows PC where OmniRoute is running
    runs-on: [self-hosted, Windows, X64]

    permissions:
      contents: read
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add Git Bash and Bun to PATH
        run: |
          # Add Git Bash (from Chocolatey or standard install) to PATH
          if (Test-Path "C:\Program Files\Git\usr\bin\bash.exe") {
            Write-Host "Adding Git Bash to PATH"
            Add-Content $env:GITHUB_PATH "C:\Program Files\Git\usr\bin"
          }
          # Download and install Bun directly (avoids setup-bun symlink EPERM issue)
          if (-not (Get-Command bun -ErrorAction SilentlyContinue)) {
            Write-Host "Installing Bun..."
            Invoke-WebRequest -Uri "https://github.com/oven-sh/bun/releases/latest/download/bun-windows-x64.zip" -OutFile "$env:TEMP\bun.zip"
            Expand-Archive -Path "$env:TEMP\bun.zip" -DestinationPath "$env:LOCALAPPDATA\bun" -Force
            Add-Content $env:GITHUB_PATH "$env:LOCALAPPDATA\bun\bun-windows-x64"
          } else {
            Write-Host "Bun already installed at $(Get-Command bun | Select-Object -ExpandProperty Source)"
          }

      - name: Install dependencies
        run: |
          python -m pip install pytest

      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=short

      - name: Claude Code Review
        uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_BASE_URL: http://localhost:20128
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.OMNIROUTE_API_KEY }}
        with:
          prompt: |
            Read CLAUDE.md in this repository to understand the project standards.

            Review every Python file changed in this pull request.

            Check for:

            BLOCKING ISSUES:
            - Any function missing type hints
            - Any function missing a docstring
            - Any new function with no corresponding test
            - Any function longer than 20 lines

            WARNINGS:
            - Magic numbers used without named constants
            - Functions with more than 3 parameters
            - Missing edge case tests

            Format your response as:

            ## Claude Code Review

            ### BLOCKING ISSUES

            (list each issue with file, function name, and exact problem)

            ### WARNINGS

            (list each warning with file and explanation)

            ### SUMMARY

            (one sentence: APPROVED or CHANGES REQUIRED)

            If there are any BLOCKING ISSUES, end with exactly:

            REVIEW_STATUS: BLOCKED

            If there are no blocking issues, end with:

            REVIEW_STATUS: APPROVED
